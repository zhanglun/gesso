<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>壁纸静帧生成</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { width: 100vw; height: 100vh; display: block; }
  .clock {
    width: 100vw; height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; position: relative;
    font-family: -apple-system, "PingFang SC", sans-serif; color: #eaf0ff;
    background: #101426;
  }
  .ring { position: absolute; width: 44vmin; height: 44vmin; border-radius: 50%;
    border: 1px solid rgba(120, 170, 255, 0.25); }
window.__err = null; window.onerror = function(m){ window.__err = String(m); document.title = window.__err; };
  .time { font-size: 12vw; font-weight: 200; letter-spacing: 0.04em; font-variant-numeric: tabular-nums; }
  .date { font-size: 2.4vw; opacity: 0.55; margin-top: 1vh; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<script>
const SHADERS = {
plasma:`void mainImage(out vec4 fragColor, in vec2 fragCoord) {
    vec2 uv = fragCoord / iResolution.xy;
    vec2 p = (fragCoord * 2.0 - iResolution.xy) / min(iResolution.x, iResolution.y);
    float t = iTime * 0.6;
    float v = sin(p.x * 3.0 + t) + sin((p.y + t) * 2.0) + sin((p.x + p.y + t) * 2.0)
            + sin(length(p + vec2(sin(t * 0.3), cos(t * 0.2))) * 4.0);
    vec3 col = 0.5 + 0.5 * cos(t + v + vec3(0.0, 2.1, 4.2));
    fragColor = vec4(col * (0.6 + 0.4 * uv.y), 1.0);
}`,
aurora:`void mainImage(out vec4 fragColor, in vec2 fragCoord) {
    vec2 uv = fragCoord / iResolution.xy;
    float t = iTime * 0.15;
    float band = 0.0;
    for (int i = 0; i < 3; i++) {
        float fi = float(i);
        float y = uv.y - 0.35 - fi * 0.10 - 0.12 * sin(uv.x * (3.0 + fi) + t * (1.0 + fi * 0.7));
        band += 0.012 / max(abs(y), 0.004);
    }
    vec3 col = vec3(0.04, 0.10, 0.09) + vec3(0.10, 0.90, 0.55) * band;
    col += vec3(0.03, 0.05, 0.06) * uv.y;
    fragColor = vec4(col, 1.0);
}`,
starfield:`float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
void mainImage(out vec4 fragColor, in vec2 fragCoord) {
    vec2 uv = fragCoord / iResolution.xy;
    vec3 col = vec3(0.012, 0.016, 0.035);
    float n = sin(uv.x * 3.1 + iTime * 0.02) * cos(uv.y * 2.3 - iTime * 0.015)
            + sin((uv.x + uv.y) * 4.7 + iTime * 0.011);
    col += vec3(0.10, 0.13, 0.22) * (0.5 + 0.5 * n) * 0.35;
    for (int layer = 1; layer <= 3; layer++) {
        float scale = 30.0 * float(layer);
        float cellPx = iResolution.y / scale;
        vec2 g = fragCoord / cellPx;
        vec2 id = floor(g);
        vec2 f = fract(g) - 0.5;
        float h = hash(id);
        if (h > 0.80) {
            vec2 offs = (vec2(hash(id + 7.3), hash(id + 3.1)) - 0.5) * 0.7;
            float dPx = length(f - offs) * cellPx;
            float tw = 0.55 + 0.45 * sin(iTime * (0.5 + h) + h * 40.0);
            col += mix(vec3(0.82, 0.87, 1.0), vec3(1.0, 0.9, 0.75), h)
                   * (smoothstep(1.8, 0.4, dPx) + smoothstep(5.0, 0.0, dPx) * 0.30) * tw / float(layer) * 1.3;
        }
    }
    fragColor = vec4(col, 1.0);
}`,
ember:`float hash(vec2 p) { return fract(sin(dot(p, vec2(269.5, 183.3))) * 43758.5453); }
void mainImage(out vec4 fragColor, in vec2 fragCoord) {
    vec2 uv = fragCoord / iResolution.xy;
    vec3 col = vec3(0.03, 0.02, 0.025);
    col += vec3(0.35, 0.10, 0.04) * exp(-uv.y * 4.5) * (0.8 + 0.2 * sin(iTime * 0.7));
    for (int layer = 0; layer < 2; layer++) {
        float fl = float(layer);
        float scale = 22.0 + fl * 10.0;
        float cellPx = iResolution.y / scale;
        vec2 g = fragCoord / cellPx;
        g.y += iTime * (0.30 + 0.15 * fl);
        g.x += 0.25 * sin(iTime * 0.4 + g.y * 0.8);
        vec2 id = floor(g);
        vec2 f = fract(g) - vec2(0.5, 0.0);
        float h = hash(id + fl * 31.7);
        if (h > 0.72) {
            float life = fract(h * 13.0 + iTime * (0.08 + 0.05 * h));
            float dPx = length(f - vec2(0.0, 0.30)) * cellPx;
            float fade = (1.0 - life) * (0.5 + 0.5 * sin(iTime * 2.2 + h * 60.0));
            vec3 tint = mix(vec3(1.0, 0.5, 0.12), vec3(1.0, 0.85, 0.45), h);
            col += tint * (smoothstep(1.6, 0.3, dPx) + smoothstep(6.0, 0.0, dPx) * 0.35) * fade * 0.9;
        }
    }
    fragColor = vec4(col, 1.0);
}`
};
const id = location.hash.slice(1) || "plasma";
if (id === "clock") {
  document.body.innerHTML =
    '<div class="clock"><span class="ring"></span><span class="time">21:42:05</span>' +
    '<span class="date">2026 年 10 月 16 日 · 周五</span></div>';
} else {
  const cvs = document.createElement("canvas");
  document.body.appendChild(cvs);
  const gl = cvs.getContext("webgl2", { antialias: false, alpha: false });
  const HEAD = `#version 300 es
precision highp float;
uniform vec3 iResolution; uniform float iTime;
out vec4 outColor;
`;
  const MAIN = `void main(){ vec4 c; mainImage(c, gl_FragCoord.xy); outColor = c; }
`;
  function sh(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(s); return s; }
  const p = gl.createProgram();
  gl.attachShader(p, sh(gl.VERTEX_SHADER, `#version 300 es
    void main(){ vec2 q = vec2(float((gl_VertexID<<1)&2), float(gl_VertexID&2));
    gl_Position = vec4(q*2.0-1.0, 0.0, 1.0); }`));
  gl.attachShader(p, sh(gl.FRAGMENT_SHADER, HEAD + SHADERS[id] + MAIN));
  gl.linkProgram(p);
  gl.useProgram(p);
  const T = { plasma: 1.2, aurora: 6.0, starfield: 3.0, ember: 4.0 }[id] || 1.0;
  function frame() {
    const dpr = 1;
    const w = Math.round(innerWidth * dpr), h = Math.round(innerHeight * dpr);
    if (cvs.width !== w || cvs.height !== h) { cvs.width = w; cvs.height = h; }
    gl.viewport(0, 0, w, h);
    gl.uniform3f(gl.getUniformLocation(p, "iResolution"), w, h, 1);
    gl.uniform1f(gl.getUniformLocation(p, "iTime"), T);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    requestAnimationFrame(frame);
  }
  frame();
}
</script>
</body>
</html>
