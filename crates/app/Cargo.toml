[package]
name = "gesso-app"
description = "Gesso 桌面应用（GPUI）：管理窗口、壁纸窗口壳、贴壁层、事件桥、协议层"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "gesso"
path = "src/main.rs"

[dependencies]
gesso-core = { path = "../core" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# gpui-kit 0.7（Apache-2.0，Longbridge Pro 生产验证）：钉定 gpui-pre =0.3.7 快照并 re-export gpui。
# 事实链（2026-10 核实）：直接依赖 crates.io 的 gpui 0.2.2 与 kit 不兼容（不同 crate）；
# 官方 gpui_platform 未发布，kit 用的是快照版 gpui-pre-platform；gpui-wry 同仓同版本（M0.5 用）。
# ⚠️ gpui-pre 为周更快照通道，API 可变——升级必须整组快照一起动，且只在里程碑间隙做。
gpui-kit = "0.7"
lb-wry = "0.53"
raw-window-handle = "0.6"
single-instance = "0.3"
rfd = "0.15"
auto-launch = "0.5"
tray-icon = "0.26.0"
# 托盘图标 PNG 解码（内嵌 assets/icons/tray/*.png → RGBA）
png = "0.17"
objc2-core-graphics = "0.3"

# 平台依赖（贴壁层 §4；M1 起使用，先声明锁定版本）
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
  "Win32_UI_Accessibility",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage", "NSWindow", "NSWorkspace", "NSScreen", "NSColor", "NSResponder"] }
objc2-foundation = { version = "0.3", features = ["NSData", "NSGeometry", "NSDictionary", "NSString"] }
# 缩略图抽帧（thumb.rs）：AVFoundation 走 objc2 生成绑定——所有权（init/copy 家族 →
# Retained<T>、autorelease 语义）由类型承载，杜绝 v1 裸 msg_send 的人肉引用计数。
# 最小 feature 集（非默认全量 158 个），AVAsset 含 AVURLAsset 子类声明。
objc2-av-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "AVAsset",
  "AVAssetImageGenerator",
  "objc2-core-graphics",
  "objc2-core-media",
] }
# CMTime（CMTime::new / with_seconds / seconds）+ 自链接 CoreMedia 框架
objc2-core-media = "0.3"
# shader 缩略图采集（shader_thumb.rs）：WKWebView 快照把宿主页渲染落成 PNG
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKSnapshotConfiguration"] }
block2 = "0.6"


