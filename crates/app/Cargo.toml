[package]
name = "gesso-app"
description = "Gesso 桌面应用（GPUI）：管理窗口、壁纸窗口壳、贴壁层、事件桥、协议层"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "gesso"
path = "src/main.rs"

[dependencies]
gesso-core = { path = "../core" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# gpui-kit 0.7（Apache-2.0，Longbridge Pro 生产验证）：钉定 gpui-pre =0.3.7 快照并 re-export gpui。
# 事实链（2026-10 核实）：直接依赖 crates.io 的 gpui 0.2.2 与 kit 不兼容（不同 crate）；
# 官方 gpui_platform 未发布，kit 用的是快照版 gpui-pre-platform；gpui-wry 同仓同版本（M0.5 用）。
# ⚠️ gpui-pre 为周更快照通道，API 可变——升级必须整组快照一起动，且只在里程碑间隙做。
gpui-kit = "0.7"
lb-wry = "0.53"
raw-window-handle = "0.6"
single-instance = "0.3"
tray-icon = "0.26.0"

# 平台依赖（贴壁层 §4；M1 起使用，先声明锁定版本）
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
  "Win32_UI_Accessibility",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSWorkspace", "NSScreen", "NSColor", "NSResponder"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSDictionary", "NSString"] }


