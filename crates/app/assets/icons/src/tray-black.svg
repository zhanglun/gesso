<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <defs>
    <mask id="gap">
      <rect width="24" height="24" fill="white"/>
      <!-- 前层外扩 1.75 的留缝,保证 16px 下两层不粘连 -->
      <rect x="1.75" y="7" width="17" height="15.25" rx="5.25" fill="black"/>
    </mask>
  </defs>
  <rect x="9" y="3" width="11.5" height="9" rx="3" fill="#000000" mask="url(#gap)"/>
  <rect x="3.5" y="8.75" width="13.5" height="11.75" rx="3.5" fill="#000000"/>
</svg>